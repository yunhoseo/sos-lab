# Supabase 무료 플랜은 약 7일 미사용 시 자동 일시정지 → 3일마다 DB를 한 번 조회해 깨워 둔다.
name: supabase keep-alive
on:
  schedule:
    - cron: "0 0 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          URL=$(grep -o 'https://[a-z0-9]*\.supabase\.co' config.js)
          KEY=$(grep -o 'eyJ[^"]*' config.js)
          curl -fsS "$URL/rest/v1/students?select=name&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY"
